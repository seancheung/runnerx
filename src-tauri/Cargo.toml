[package]
name = "runnerx"
version = "0.1.0"
description = "Visual runner for user scripts"
authors = ["you"]
edition = "2021"

[lib]
name = "runnerx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "fs"] }
thiserror = "1"
once_cell = "1"
uuid = { version = "1", features = ["v4"] }
