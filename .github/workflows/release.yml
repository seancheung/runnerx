name: Release

# 推 v* 标签时触发（例：git tag v0.1.0 && git push origin v0.1.0）。
# 也可以从 Actions 页手动触发，用于排查打包问题。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal2：兜底产物，单一二进制覆盖 Apple Silicon + Intel，体积约 2x
          - platform: macos-latest
            args: --target universal-apple-darwin
            label: macos-universal
          # macOS Apple Silicon 专版：体积约一半，M 系列用户优先下载
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            label: macos-arm64
          # Windows：默认 x86_64-pc-windows-msvc
          - platform: windows-latest
            args: ''
            label: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets for macOS universal
        if: contains(matrix.args, 'universal-apple-darwin')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # 把 git tag（去掉 v 前缀）写进 tauri.conf.json / package.json / Cargo.toml。
      # 这样 dmg / msi / nsis 的文件名就和 tag 对齐，而不是 manifest 里写死的版本。
      # 必须放在 `npm ci` 之后：ci 会校验 package.json 与 lockfile 的版本一致，
      # 提前改 package.json 会让 ci 失败。tauri-action 跑 `npm run build`（vite）
      # 不再触发 ci，所以这时候改 package.json 是安全的。
      # workflow_dispatch 手动触发时跳过（github.ref_name 可能是分支名）。
      - name: Set version from git tag (Unix)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to $VERSION"
          node -e "const f='src-tauri/tauri.conf.json';const o=require('./'+f);o.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(o,null,2)+'\n')"
          node -e "const f='package.json';const o=require('./'+f);o.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(o,null,2)+'\n')"
          # Cargo.toml 只改 [package] 那个 version 行（第一个匹配）
          sed -i.bak -E '0,/^version = "[^"]*"/s//version = "'"$VERSION"'"/' src-tauri/Cargo.toml && rm src-tauri/Cargo.toml.bak

      - name: Set version from git tag (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Write-Host "Setting version to $version"
          $f = 'src-tauri/tauri.conf.json'
          $o = Get-Content $f -Raw | ConvertFrom-Json
          $o.version = $version
          ($o | ConvertTo-Json -Depth 100) + "`n" | Set-Content $f -NoNewline
          $f = 'package.json'
          $o = Get-Content $f -Raw | ConvertFrom-Json
          $o.version = $version
          ($o | ConvertTo-Json -Depth 100) + "`n" | Set-Content $f -NoNewline
          (Get-Content src-tauri/Cargo.toml) -replace '^version = ".*"$', "version = `"$version`"" | Set-Content src-tauri/Cargo.toml

      - name: Build & upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 不签名：自用 / 内部分享够了。要发布给外部用户时再补签名相关 secrets，
          # 见底部注释。
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'runnerx ${{ github.ref_name }}'
          releaseBody: |
            自动构建产物。

            - macOS (universal): `.dmg` / `.app.tar.gz`
            - Windows: `.msi` / `.exe` (NSIS)

            **macOS 首次打开**：产物未签名 / 未公证，Gatekeeper 会阻挡。
            右键选"打开"（或运行 `xattr -dr com.apple.quarantine /Applications/runnerx.app`）。

            **Windows 首次打开**：未签名安装包会触发 SmartScreen 警告，
            选择"更多信息" → "仍要运行"。
          # releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 额外：把产物当 workflow artifact 也存一份，
      # 便于 workflow_dispatch 手动触发时下载（手动触发不会写 release）。
      - name: Upload artifacts (workflow_dispatch fallback)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: runnerx-${{ matrix.label }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app.tar.gz
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/nsis/*.exe
          if-no-files-found: ignore

# ============================================================
# 想加 macOS 代码签名 / 公证时，按下面在仓库 Settings → Secrets 配齐：
#
#   APPLE_CERTIFICATE             — base64(.p12)
#   APPLE_CERTIFICATE_PASSWORD    — p12 密码
#   APPLE_SIGNING_IDENTITY        — "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                      — Apple ID 邮箱
#   APPLE_PASSWORD                — App-specific password
#   APPLE_TEAM_ID                 — Team ID
#
# 然后在上面 Build & upload artifacts 步骤的 env 里补：
#
#   ENABLE_CODE_SIGNING:   ${{ secrets.APPLE_CERTIFICATE }}
#   APPLE_CERTIFICATE:     ${{ secrets.APPLE_CERTIFICATE }}
#   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
#   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
#   APPLE_ID:              ${{ secrets.APPLE_ID }}
#   APPLE_PASSWORD:        ${{ secrets.APPLE_PASSWORD }}
#   APPLE_TEAM_ID:         ${{ secrets.APPLE_TEAM_ID }}
#
# Windows 签名同理：WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD
# (PFX) — tauri.conf.json 的 windows.certificateThumbprint 也要配。
# ============================================================
