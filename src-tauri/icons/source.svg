<?xml version="1.0" encoding="UTF-8"?>
<!--
  runnerx icon source. After editing, regenerate the full set:
    npm run icons
  Requires rsvg-convert (brew install librsvg). The script also strips out
  Tauri's auto-generated mobile / MSIX outputs that the desktop bundle doesn't use.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5cb1ff"/>
      <stop offset="100%" stop-color="#1864ab"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.30"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方背景。半径 230 ≈ 22.37% × 1024，对齐 Apple icon template -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- ">" chevron -->
  <polyline points="320,360 500,512 320,664"
    stroke="#ffffff" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"
    fill="none" filter="url(#softShadow)"/>

  <!-- "_" 光标 -->
  <rect x="560" y="618" width="190" height="46" rx="23" fill="#ffffff" filter="url(#softShadow)"/>
</svg>
