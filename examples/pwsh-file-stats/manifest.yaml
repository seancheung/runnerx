# yaml-language-server: $schema=../../schema/manifest.schema.json
name: 文件大小统计
description: 列出指定目录里最大的 N 个文件，按大小倒序输出表格。演示 PowerShell 入口跨平台。
version: 0.1.0
category: 文件批处理
tags: [powershell, file]

# macOS 上走 pwsh (PowerShell 7+，需用户预先 brew install --cask powershell)
# macos:
#   entry:
#     command: pwsh
#     args: ["-NoProfile", "-NonInteractive", "-File", "run.ps1"]
#     argsMode: env

# Windows 上用系统自带的 powershell.exe (Windows PowerShell 5.1)，开箱即用
windows:
  entry:
    command: powershell.exe
    args: ["-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "run.ps1"]
    argsMode: env

inputs:
  - id: target_dir
    label: 扫描目录
    type: directory
    required: true

  - id: top_n
    label: 显示前 N 个
    type: number
    integer: true
    min: 1
    max: 100
    default: 10

  - id: recurse
    label: 包含子目录
    type: boolean
    default: false

  - id: filter
    label: 文件名过滤
    type: string
    placeholder: "*.log"
    default: "*"
    description: "PowerShell 通配符（不是正则），例：*.log、*.{mp4,mov}"

  - id: min_kb
    label: 仅显示大于 (KB)
    type: number
    integer: true
    min: 0
    default: 0
